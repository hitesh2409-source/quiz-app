<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitesh's webdev Quiz App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        min-height: 100vh;
        color: #1f2937;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #fff;
        width: 100%;
        max-width: 640px;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .center { text-align: center; align-items: center; }
      .muted { color: #6b7280; }
      .badge {
        background: #eef2ff;
        color: #4f46e5;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 600;
      }
      .btn {
        border: none;
        padding: 14px 24px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn.primary { background: #4f46e5; color: white; }
      .btn.primary:hover:not(:disabled) { background: #4338ca; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .categories { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .chip {
        border: 2px solid #e5e7eb;
        background: #fff;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
      }
      .chip.selected {
        border-color: #4f46e5;
        background: #eef2ff;
        color: #4f46e5;
      }
      .progress-bar {
        height: 10px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
      }
      .progress-fill {
        height: 100%;
        background: #4f46e5;
        transition: width 0.3s;
      }
      .question { font-size: 1.3rem; margin-bottom: 14px; }
      .options { display: flex; flex-direction: column; gap: 10px; }
      .option {
        text-align: left;
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        background: #fff;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .option:hover { border-color: #a5b4fc; }
      .option.selected {
        border-color: #4f46e5;
        background: #eef2ff;
        font-weight: 600;
      }
      .score { font-size: 3rem; font-weight: 800; color: #4f46e5; }
      .message { font-size: 1.1rem; font-weight: 600; }
      @media (max-width: 480px) {
        .card { padding: 20px; }
        .question { font-size: 1.1rem; }
        .score { font-size: 2.4rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const questions = [
        { id: 1, category: 'React', question: 'Which hook manages state in React?', options: ['useState', 'useFetch', 'useStyle', 'useRender'], answer: 0 },
        { id: 2, category: 'React', question: 'How do you pass data from a parent component to a child component?', options: ['State', 'Props', 'Refs', 'Hooks'], answer: 1 },
        { id: 3, category: 'React', question: 'Which array method is commonly used to render a list in React?', options: ['forEach()', 'filter()', 'map()', 'reduce()'], answer: 2 },
        { id: 4, category: 'React', question: 'What must a React component name start with?', options: ['Lowercase letter', 'Number', 'Underscore', 'Uppercase letter'], answer: 3 },

        { id: 5, category: 'JavaScript', question: 'Which keyword declares a block-scoped variable that can be reassigned?', options: ['var', 'const', 'let', 'static'], answer: 2 },
        { id: 6, category: 'JavaScript', question: 'Which array method adds an item to the end of an array?', options: ['push()', 'pop()', 'shift()', 'slice()'], answer: 0 },
        { id: 7, category: 'JavaScript', question: 'What does typeof null return?', options: ['null', 'undefined', 'object', 'number'], answer: 2 },
        { id: 8, category: 'JavaScript', question: 'What does the === operator compare?', options: ['Value only', 'Value and type', 'Type only', 'Memory address'], answer: 1 },

        { id: 9, category: 'HTML/CSS', question: 'Which HTML tag is used for the largest heading?', options: ['<h6>', '<head>', '<heading>', '<h1>'], answer: 3 },
        { id: 10, category: 'HTML/CSS', question: 'Which CSS property changes the text color?', options: ['font-color', 'color', 'text-style', 'foreground'], answer: 1 },
        { id: 11, category: 'HTML/CSS', question: "What does 'display: flex' enable in CSS?", options: ['Flexbox layout', 'Hidden elements', 'Animations', 'Fixed positioning'], answer: 0 },
        { id: 12, category: 'HTML/CSS', question: 'Which CSS rule is used to make a page responsive for different screen sizes?', options: ['@media', '@import', '@keyframes', '@font-face'], answer: 0 }
      ];

      const CATEGORIES = ['All', 'React', 'JavaScript', 'HTML/CSS'];

      function getMessage(percent) {
        if (percent === 100) return '🏆 Perfect score! Outstanding!';
        if (percent >= 70) return '🎉 Great job! You know your stuff.';
        if (percent >= 40) return '👍 Not bad! A little more practice will help.';
        return "📚 Keep learning, you'll get there!";
      }

      function App() {
        const [stage, setStage] = React.useState('start');
        const [category, setCategory] = React.useState('All');
        const [currentIndex, setCurrentIndex] = React.useState(0);
        const [selected, setSelected] = React.useState(null);
        const [score, setScore] = React.useState(0);

        const quizQuestions =
          category === 'All'
            ? questions
            : questions.filter((q) => q.category === category);

        const currentQuestion = quizQuestions[currentIndex];
        const isLast = currentIndex === quizQuestions.length - 1;

        const handleStart = () => {
          setCurrentIndex(0);
          setSelected(null);
          setScore(0);
          setStage('quiz');
        };

        const handleNext = () => {
          if (selected === currentQuestion.answer) {
            setScore((prev) => prev + 1);
          }

          if (isLast) {
            setStage('result');
          } else {
            setCurrentIndex((prev) => prev + 1);
            setSelected(null);
          }
        };

        const handleRestart = () => {
          setStage('start');
        };

        return (
          <main className="container">
            {stage === 'start' && (
              <div className="card center">
                <h1>⚡ React Quiz</h1>
                <p className="muted">
                  Test your web development knowledge with multiple-choice questions.
                </p>

                <div className="categories">
                  {CATEGORIES.map((name) => (
                    <button
                      type="button"
                      key={name}
                      className={`chip ${category === name ? 'selected' : ''}`}
                      onClick={() => setCategory(name)}
                    >
                      {name}
                    </button>
                  ))}
                </div>

                <p className="badge">{quizQuestions.length} Questions</p>
                <button type="button" className="btn primary" onClick={handleStart}>
                  Start Quiz
                </button>
              </div>
            )}

            {stage === 'quiz' && (
              <div className="card">
                <div>
                  <p className="muted">
                    Question {currentIndex + 1} / {quizQuestions.length}
                  </p>
                  <div className="progress-bar">
                    <div
                      className="progress-fill"
                      style={{ width: `${((currentIndex + 1) / quizQuestions.length) * 100}%` }}
                    />
                  </div>
                </div>

                <div>
                  <h2 className="question">{currentQuestion.question}</h2>
                  <div className="options">
                    {currentQuestion.options.map((text, index) => (
                      <button
                        type="button"
                        key={index}
                        className={`option ${selected === index ? 'selected' : ''}`}
                        onClick={() => setSelected(index)}
                      >
                        {text}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="button"
                  className="btn primary"
                  disabled={selected === null}
                  onClick={handleNext}
                >
                  {isLast ? 'Finish Quiz' : 'Next Question'}
                </button>
              </div>
            )}

            {stage === 'result' && (
              <div className="card center">
                <h1>Quiz Complete</h1>
                <p className="score">{score} / {quizQuestions.length}</p>
                <p className="muted">
                  ✅ Correct: {score} &nbsp;|&nbsp; ❌ Incorrect: {quizQuestions.length - score}
                </p>
                <p className="message">{getMessage((score / quizQuestions.length) * 100)}</p>
                <button type="button" className="btn primary" onClick={handleRestart}>
                  Restart Quiz
                </button>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
